name: One-time fork artifact cleanup

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          while true; do
            ids="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id')"
            [ -z "$ids" ] && break
            while IFS= read -r id; do
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              deleted=$((deleted + 1))
            done <<< "$ids"
          done
          echo "Deleted ${deleted} artifacts."
